name: Magnificent Monsters Monitor

on:
  schedule:
    - cron: '*/10 * * * *' # Runs every 10 minutes
  repository_dispatch:
    types: [trigger-monitor]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # This restores the state.json from the previous run
      - name: Retrieve State
        uses: actions/cache@v4
        with:
          path: state.json
          key: monitor-state-${{ github.run_id }}
          restore-keys: |
            monitor-state-

      - name: Install Dependencies
        run: |
          pip install curl_cffi requests playwright playwright-stealth
          playwright install --with-deps chromium

      - name: Run Monitor-chan
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python check.py
